spring.application.name=security

# Override locally with env vars: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION_MS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/security}
spring.datasource.username=${DB_USERNAME:Admin}
spring.datasource.password=${DB_PASSWORD:Venky@2005}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET:my-super-secret-key-that-is-at-least-32-chars-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Created once on startup when this email is not already in the users table.
# Signup always stores USER. This is the account that can open /api/v1/admin/**.
app.admin.email=${ADMIN_EMAIL:admin@vaultline.test}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
